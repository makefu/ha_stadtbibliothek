renew_loan:
  name: Renew Loan
  description: Renew a single library loan by item ID.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The config entry ID of the library account.
      required: true
      selector:
        text:
    item_id:
      name: Item ID
      description: The barcode or item ID of the loan to renew.
      required: true
      selector:
        text:

renew_all:
  name: Renew All Loans
  description: Renew all renewable loans for a library account.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The config entry ID of the library account.
      required: true
      selector:
        text:
    days_remaining_threshold:
      name: Days Remaining Threshold
      description: Only renew loans with this many days or fewer remaining before due date.
      default: 14
      selector:
        number:
          min: 0
          max: 90
          step: 1

force_update:
  name: Force Update
  description: Force an immediate data refresh for a library account.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The config entry ID of the library account.
      required: true
      selector:
        text:
