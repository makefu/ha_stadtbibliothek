[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-stadtbibliothek"
version = "1.3.0"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "html5lib",
    "lxml",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.stadtbibliothek" = ["manifest.json", "services.yaml", "strings.json"]

[project.scripts]
stadtbibliothek-remseck = "custom_components.stadtbibliothek.cli_remseck:main"
stadtbibliothek-stuttgart = "custom_components.stadtbibliothek.cli_stuttgart:main"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
